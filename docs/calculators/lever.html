<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鏡の傾きと光点移動（光てこ）計算機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow"><a href="../index.html">Optics Calculator</a></div>
  <h1>鏡の傾きと光点移動（光てこ）</h1>
</header>

<section class="calc">
  <p class="sub">鏡が Δφ 傾くと、反射光は 2Δφ 振れます。距離 L 先のスクリーン上で光点がどれだけ動くかを求めます。角度は「°」、長さは「mm」です。</p>
  <div class="inputs">
    <label>鏡の傾き Δφ <span class="u">[°]</span><input id="l_phi" type="number" step="0.001" value="0.010"></label>
    <label>鏡からスクリーンまでの距離 L <span class="u">[mm]</span><input id="l_L" type="number" step="1" min="0" value="1000"></label>
  </div>
  <div class="results" id="l_out"></div>
  <details open><summary>使っている式</summary>
<div class="formula">反射光の振れ角  δ = 2Δφ
光点の移動量    d = L · tan(2Δφ)
微小角近似      d ≈ 2LΔφ  （Δφ はラジアン）</div></details>
</section>

<section class="calc">
  <h2>検証値</h2>
  <p class="sub">d = L·tan(2Δφ) を電卓で計算した値と照合しています。</p>
  <div class="tbl"><table id="tests"><thead><tr><th>条件</th><th>期待値</th><th>計算値</th><th>判定</th></tr></thead><tbody></tbody></table></div>
</section>

<footer>計算結果は参考値です。設計などに使う前に必ず確認してください。</footer>
</div>
<script type="module" src="../js/pages/lever.js"></script>
</body>
</html>
