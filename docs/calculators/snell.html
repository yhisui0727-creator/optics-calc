<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スネルの法則・臨界角 計算機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow"><a href="../index.html">Optics Calculator</a></div>
  <h1>スネルの法則・臨界角</h1>
</header>

<section class="calc">
  <p class="sub">媒質1から媒質2へ光が入るときの屈折角を求めます。媒質1の方が屈折率が大きいときは、全反射が始まる臨界角も表示します。角度の単位は「°」です。</p>
  <div class="inputs">
    <label>入射側の屈折率 n₁ <input id="s_n1" type="number" step="0.001" min="1" value="1.517"></label>
    <label>透過側の屈折率 n₂ <input id="s_n2" type="number" step="0.001" min="1" value="1.000"></label>
    <label>入射角 θᵢ <span class="u">[°]</span><input id="s_th" type="number" step="0.1" min="0" max="89.9" value="30"></label>
  </div>
  <div class="results" id="s_out"></div>
  <details open><summary>使っている式</summary>
<div class="formula">n₁ sin θᵢ = n₂ sin θₜ
臨界角  θc = arcsin(n₂ / n₁)   （n₁ &gt; n₂ のときのみ）
θᵢ ≥ θc のとき全反射</div></details>
</section>

<section class="calc">
  <h2>検証値</h2>
  <p class="sub">教科書や公知の値と計算結果を照合しています。</p>
  <div class="tbl"><table id="tests"><thead><tr><th>条件</th><th>期待値</th><th>計算値</th><th>判定</th></tr></thead><tbody></tbody></table></div>
</section>

<footer>計算結果は参考値です。設計などに使う前に必ず確認してください。</footer>
</div>
<script type="module" src="../js/pages/snell.js"></script>
</body>
</html>
